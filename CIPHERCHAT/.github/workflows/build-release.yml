name: CipherChat Cross-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: |
          cd client
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleRelease
