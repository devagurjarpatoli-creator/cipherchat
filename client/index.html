<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherChat</title>
  <style>
    .hidden { display: none; }
    #chat-box { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    #debug-log { font-family: monospace; font-size: 11px; color: #666; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 5px; }
  </style>
</head>
<body>
  <h2>CipherChat</h2>
  <div id="status">Connecting to backend...</div>

  <!-- Auth Section -->
  <div id="auth-section">
    <h3>Login / Register</h3>
    <input type="text" id="username" placeholder="Username" />
    <button id="login-btn">Login / Continue</button>
  </div>

  <!-- Chat Section -->
  <div id="chat-section" class="hidden">
    <h3>Live Chat</h3>
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <!-- On-Screen Debug Area -->
  <div id="debug-log"><strong>Debug Log:</strong></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
