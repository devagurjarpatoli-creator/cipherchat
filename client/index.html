<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherChat — Encrypted Files & DMs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .app-card { background: #fff; width: 100%; max-width: 800px; height: 90vh; max-height: 700px; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    
    .header { background: #128c7e; color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 1.1rem; }
    #status { font-size: 0.8rem; opacity: 0.9; }

    #auth-section { padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
    input[type="text"] { width: 100%; max-width: 300px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; margin-bottom: 12px; }
    button { background: #128c7e; color: #fff; border: none; padding: 12px 20px; font-size: 0.95rem; border-radius: 8px; cursor: pointer; }
    button:hover { background: #0e6c61; }

    #chat-section { display: flex; flex: 1; height: calc(100% - 50px); overflow: hidden; }
    
    .sidebar { width: 220px; background: #f8f9fa; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .sidebar-title { padding: 12px; font-size: 0.85rem; font-weight: bold; color: #666; border-bottom: 1px solid #eee; text-transform: uppercase; }
    .user-list { flex: 1; overflow-y: auto; list-style: none; }
    .user-item { padding: 12px; font-size: 0.9rem; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; }
    .user-item:hover, .user-item.active { background: #e8f5e9; font-weight: bold; color: #128c7e; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
    .chat-header { background: #ededed; padding: 10px 16px; font-weight: bold; font-size: 0.9rem; border-bottom: 1px solid #ddd; color: #333; }
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
    .msg.sent { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 2px; }
    .msg.received { align-self: flex-start; background: #ffffff; border-top-left-radius: 2px; }
    .msg .sender-name { font-size: 0.72rem; font-weight: bold; color: #075e54; margin-bottom: 2px; }
    
    .msg img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 4px; display: block; }
    .msg a.file-link { color: #075e54; font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 4px; }

    .input-bar { display: flex; gap: 8px; padding: 12px; background: #f0f0f0; border-top: 1px solid #e0e0e0; align-items: center; }
    .input-bar input[type="text"] { flex: 1; margin-bottom: 0; }
    .file-btn { background: #666; padding: 10px 12px; font-size: 1rem; border-radius: 8px; cursor: pointer; color: white; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h2>CipherChat E2EE</h2>
      <div id="status">Connecting...</div>
    </div>

    <!-- Auth -->
    <div id="auth-section">
      <h3>Welcome to CipherChat</h3>
      <p style="margin-bottom: 15px; color: #666; font-size: 0.85rem;">Select your username to join</p>
      <input type="text" id="username" placeholder="Display name" />
      <button id="login-btn">Join Chat</button>
    </div>

    <!-- Main Workspace -->
    <div id="chat-section" class="hidden">
      <div class="sidebar">
        <div class="sidebar-title">Active Conversations</div>
        <ul class="user-list" id="user-list">
          <li class="user-item active" data-user="Global">🌐 Global Room</li>
        </ul>
      </div>

      <div class="chat-area">
        <div class="chat-header" id="current-chat-title">Chatting in: Global Room</div>
        <div id="chat-box"></div>
        <div class="input-bar">
          <button class="file-btn" id="attach-btn" title="Attach file">📎</button>
          <input type="file" id="file-input" class="hidden" />
          <input type="text" id="message-input" placeholder="Type an encrypted message..." />
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cipherchat-x8nx.onrender.com/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
