<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherChat — Encrypted Messaging</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .chat-card { background: #fff; width: 100%; max-width: 480px; height: 90vh; max-height: 680px; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    .header { background: #128c7e; color: #fff; padding: 16px; text-align: center; }
    .header h2 { font-size: 1.25rem; font-weight: 600; }
    #status { font-size: 0.8rem; margin-top: 4px; opacity: 0.9; }

    /* Auth Screen */
    #auth-section { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }
    #auth-section h3 { margin-bottom: 8px; color: #333; }
    #auth-section p { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
    
    /* Form Inputs */
    input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: #128c7e; }
    button { background: #128c7e; color: #fff; border: none; padding: 12px 18px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0e6c61; }

    /* Chat Screen */
    #chat-section { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 8px; }
    
    /* Chat Bubbles */
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; position: relative; }
    .msg.sent { align-self: flex-end; background: #dcf8c6; color: #000; border-top-right-radius: 2px; }
    .msg.received { align-self: flex-start; background: #ffffff; color: #000; border-top-left-radius: 2px; }
    .msg .sender-name { font-size: 0.72rem; font-weight: bold; color: #075e54; margin-bottom: 2px; }

    /* Input Bar */
    .input-bar { display: flex; gap: 8px; padding: 12px; background: #f0f0f0; border-top: 1px solid #e0e0e0; }
    .input-bar input { flex: 1; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="header">
      <h2>CipherChat</h2>
      <div id="status">Connecting to backend...</div>
    </div>

    <!-- Login Form -->
    <div id="auth-section">
      <h3>Welcome Back</h3>
      <p>End-to-End Encrypted Private Messaging</p>
      <input type="text" id="username" placeholder="Enter your display name" style="margin-bottom: 12px;" />
      <button id="login-btn">Start Chatting</button>
    </div>

    <!-- Live Chat Container -->
    <div id="chat-section" class="hidden">
      <div id="chat-box"></div>
      <div class="input-bar">
        <input type="text" id="message-input" placeholder="Type an encrypted message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="https://cipherchat-x8nx.onrender.com/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
