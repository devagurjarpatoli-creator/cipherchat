<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherChat</title>
  <style>
    .hidden { display: none; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>CipherChat</h2>
  <div id="status">Connecting to backend...</div>

  <!-- Auth Section -->
  <div id="auth-section">
    <h3>Login / Register</h3>
    <input type="text" id="username" placeholder="Username" />
    <button id="login-btn">Login / Continue</button>
  </div>

  <!-- Chat Section -->
  <div id="chat-section" class="hidden">
    <h3>Live Chat</h3>
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <!-- Socket.io CDN Script (Must be BEFORE app.js) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
