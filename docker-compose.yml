version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cipherchat_db
    restart: always
    environment:
      POSTGRES_USER: cipheradmin
      POSTGRES_PASSWORD: SecureCipherPassword123!
      POSTGRES_DB: cipherchat_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: cipherchat_redis
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: cipherchat_ai_engine
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cipherchat_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://cipheradmin:SecureCipherPassword123!@postgres:5432/cipherchat_prod?schema=public"
      REDIS_URL: "redis://redis:6379"
      AI_ENGINE_URL: "http://ollama:11434/api/chat"
      AI_MODEL: "llama3.3:8b"
      OWNER_EMAIL: "devagurjarpatoli@gmail.com"
      OWNER_USERNAME: "OMNAMAHSHIVPARVATIPATEYHARHARMAHADEV"
    depends_on:
      - postgres
      - redis
      - ollama

volumes:
  pgdata:
  ollama_data: